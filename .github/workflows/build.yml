          cat > app/src/main/java/com/walkie/app/MainActivity.kt <<'WALKIE_EOF_6'
          package com.walkie.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.webkit.*
          import android.app.Activity
          import androidx.webkit.WebViewAssetLoader

          class MainActivity : Activity() {
              private lateinit var web: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val perms = mutableListOf(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= 33) perms += Manifest.permission.POST_NOTIFICATIONS
                  requestPermissions(perms.toTypedArray(), 1)

                  // serves assets over https://appassets.androidplatform.net so getUserMedia (mic) is allowed
                  val loader = WebViewAssetLoader.Builder().addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this)).build()
                  web = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.mediaPlaybackRequiresUserGesture = false
                      settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW   // ws:// to local server
                      webViewClient = object : WebViewClient() {
                          override fun shouldInterceptRequest(v: WebView, r: WebResourceRequest) = loader.shouldInterceptRequest(r.url)
                      }
                      webChromeClient = object : WebChromeClient() {
                          override fun onPermissionRequest(r: PermissionRequest) = runOnUiThread { r.grant(r.resources) }
                      }
                      addJavascriptInterface(Bridge(), "Android")
                      loadUrl("https://appassets.androidplatform.net/assets/index.html")
                  }
                  setContentView(web)
              }

              inner class Bridge {
                  @Volatile private var foundAddr = ""
                  /** Finds the host phone on this Wi-Fi by itself, so nobody types an IP. */
                  @JavascriptInterface fun scan() {
                      foundAddr = ""; val my = ip(); if (my.isEmpty()) return
                      val pre = my.substringBeforeLast('.'); val pool = java.util.concurrent.Executors.newFixedThreadPool(64)
                      for (i in 1..254) pool.execute { if (foundAddr.isEmpty()) try {
                          java.net.Socket().use { it.connect(java.net.InetSocketAddress("$pre.$i", 8765), 400); foundAddr = "$pre.$i:8765" }
                      } catch (e: Exception) {} }
                      pool.shutdown()
                  }
                  @JavascriptInterface fun found(): String = foundAddr
                  @JavascriptInterface fun host(on: Boolean): String {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) return "NOPERM"
                      startForegroundService(Intent(this@MainActivity, RadioService::class.java).putExtra("host", on))
                      return if (on) ip() else ""
                  }
                  @JavascriptInterface fun ip(): String = try {
                      java.net.NetworkInterface.getNetworkInterfaces().toList().filter { it.isUp && !it.isLoopback }
                          .flatMap { it.inetAddresses.toList() }.firstOrNull { it is java.net.Inet4Address && it.isSiteLocalAddress }?.hostAddress ?: ""
                  } catch (e: Exception) { "" }
              }

              override fun onRequestPermissionsResult(c: Int, p: Array<out String>, r: IntArray) {
                  if (r.isNotEmpty() && r[0] == PackageManager.PERMISSION_GRANTED) {
                      startForegroundService(Intent(this, RadioService::class.java))   // radio stays alive in background
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName))
                          startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
                  }
              }

              // NOTE: we deliberately never call web.onPause(), so JS/audio keep running with the screen off.
              override fun onBackPressed() { moveTaskToBack(true) }
          }
          WALKIE_EOF_6
          mkdir -p "$(dirname app/src/main/java/com/walkie/app/RadioService.kt)"
          cat > app/src/main/java/com/walkie/app/RadioService.kt <<'WALKIE_EOF_7'
          package com.walkie.app

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager

          /** Keeps the process alive (screen off / app in background) while the radio is on. */
          class RadioService : Service() {
              private var cpu: PowerManager.WakeLock? = null
              private var wifi: WifiManager.WifiLock? = null

              override fun onCreate() {
                  super.onCreate()
                  val nm = getSystemService(NotificationManager::class.java)
                  if (Build.VERSION.SDK_INT >= 26) nm.createNotificationChannel(NotificationChannel("radio", "রেডিও চালু", NotificationManager.IMPORTANCE_LOW))
                  val open = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(this, "radio")
                      .setContentTitle("Betar Radio is on").setContentText("ব্যাকগ্রাউন্ডে শুনছে")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now).setContentIntent(open).setOngoing(true).build()
                  if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE) else startForeground(1, n)

                  cpu = (getSystemService(Context.POWER_SERVICE) as PowerManager).newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "walkie:cpu").apply { acquire() }
                  val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                  val mode = if (Build.VERSION.SDK_INT >= 29) WifiManager.WIFI_MODE_FULL_LOW_LATENCY else WifiManager.WIFI_MODE_FULL_HIGH_PERF
                  wifi = wm.createWifiLock(mode, "walkie:wifi").apply { acquire() }
              }

              private var host: HostServer? = null
              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  if (i != null && i.hasExtra("host")) {
                      if (i.getBooleanExtra("host", false)) { if (host == null) host = HostServer(8765).also { it.isReuseAddr = true; it.start() } }
                      else { try { host?.stop(500) } catch (e: Exception) {}; host = null }
                  }
                  return START_STICKY
              }
              override fun onBind(i: Intent?): IBinder? = null
              override fun onDestroy() { try { host?.stop(200) } catch (e: Exception) {}; cpu?.release(); wifi?.release(); super.onDestroy() }
          }
          WALKIE_EOF_7
          mkdir -p "$(dirname app/src/main/java/com/walkie/app/HostServer.kt)"
          cat > app/src/main/java/com/walkie/app/HostServer.kt <<'WALKIE_EOF_8'
          package com.walkie.app

          import org.java_websocket.WebSocket
          import org.java_websocket.handshake.ClientHandshake
          import org.java_websocket.server.WebSocketServer
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.InetSocketAddress
          import java.nio.ByteBuffer

          /** The same relay as server.js, running inside the phone that is "host". */
          class HostServer(port: Int) : WebSocketServer(InetSocketAddress(port)) {
              class C(val id: Int, val name: String, val avatar: Int) { var room: String? = null; var win = 0L; var cnt = 0 }
              class Room { val members = LinkedHashSet<WebSocket>(); var talker: WebSocket? = null }

              private val calls = "Adrian Aegis Alaric Anton Archer Ares Atlas Aurelio Bishop Blade Boris Bravo Bruno Beckett Bond Baron Cain Carlos Cassian Charlie Cipher Cobra Cole Cyrus Damien Dante Delta Dimitri Dominic Draco Dutch Drake Echo Eclipse Elias Enzo Ethan Evander Ezio Edmund Falcon Felix Fenix Finn Foxtrot Frost Fabian Franco Gabriel Gideon Ghost Goliath Gray Griffin Gunnar Garrett Hades Hawk Hector Hugo Hunter Harlan Hotel Helios Icarus Igor Ivan India Ignis Ironside Isaac Ivo Jackal Jaeger Jasper Jericho Juliet Julian Jett Jagger Kane Kilo Kai Kestrel Knox Kovac Kyle Kronos Lazarus Leon Lima Lucian Lynx Logan Lorenzo Luther Magnus Marcus Maverick Mike Mercury Miles Morgan Maximus Nash Nero Nikolai November Noir Nathan Neo Nomad Orion Oscar Osiris Otto Oberon Onyx Omar Odin Papa Phantom Phoenix Pierce Pablo Prime Python Percival Quentin Quebec Quinn Quasar Quill Quincy Quest Quartz Rafael Raven Rex Romeo Ronin Ryker Roman Rogue Sasha Sierra Silas Spectre Stefan Storm Sterling Sergei Tango Thane Titan Tobias Tristan Tyson Talon Tycho Ulysses Uniform Uriel Ulric Umar Ultra Urban Ugo Victor Vance Valentin Viper Vlad Vector Vincent Vesper Walker Warden Whiskey Wolf Wyatt Wraith Winston Wesley Xander Xavier Xenon Xerxes Xray Xeno Xiang Xylo Yankee Yuri Yago Yusuf Yeager Yorick Yves Yasha Zulu Zane Zeus Zephyr Zorro Zack Zoran Zenith".split(" ")
              private val langCodes = setOf("en", "hi", "bn", "as", "brx", "doi", "gu", "kn", "ks", "kok", "mai", "ml", "mni", "mr", "ne", "or", "pa", "sa", "sat", "sd", "ta", "te", "ur")
              private val clients = HashMap<WebSocket, C>()
              private val names = HashMap<String, WebSocket>()
              private val rooms = HashMap<String, Room>()
              private var nextId = 1

              private fun roomOf(c: C) = c.room?.let { rooms[it] }
              private fun send(w: WebSocket, o: JSONObject) { if (w.isOpen) w.send(o.toString()) }
              private fun err(w: WebSocket, code: String, name: String = "") = send(w, JSONObject().put("t", "error").put("code", code).put("name", name))
              private fun list(r: Room) = JSONArray().also { a -> r.members.forEach { w -> clients[w]?.let { c ->
                  a.put(JSONObject().put("id", c.id).put("name", c.name).put("avatar", c.avatar).put("talking", r.talker === w)) } } }
              private fun pushMembers(r: Room) { val m = JSONObject().put("t", "members").put("list", list(r)); r.members.forEach { send(it, m) } }
              private fun pushTaken() {
                  val m = JSONObject().put("t", "taken").put("taken", JSONArray(clients.values.map { it.name }))
                  connections.forEach { send(it, m) }
              }
              private fun release(w: WebSocket) {
                  val c = clients[w] ?: return; val r = roomOf(c) ?: return
                  if (r.talker === w) { r.talker = null; pushMembers(r)
                      val m = JSONObject().put("t", "talk").put("id", c.id).put("on", false); r.members.forEach { send(it, m) } }
              }
              private fun leave(w: WebSocket) {
                  val c = clients[w] ?: return; val key = c.room ?: return
                  release(w); val r = rooms[key]
                  if (r != null) { r.members.remove(w); if (r.members.isEmpty()) rooms.remove(key) else pushMembers(r) }
                  c.room = null
              }
              private fun enter(w: WebSocket, key: String, priv: Boolean) {
                  val c = clients[w] ?: return; leave(w)
                  val r = rooms.getOrPut(key) { Room() }; r.members.add(w); c.room = key
                  send(w, JSONObject().put("t", "entered").put("room", if (priv) key else JSONObject.NULL).put("you", c.id).put("list", list(r)))
                  pushMembers(r)
              }

              override fun onOpen(w: WebSocket, h: ClientHandshake) { synchronized(this) { if (connections.size > 100) { w.close(); return }; pushTaken() } }
              override fun onClose(w: WebSocket, code: Int, reason: String?, remote: Boolean) {
                  synchronized(this) { clients[w]?.let { leave(w); names.remove(it.name.lowercase()); clients.remove(w) }; pushTaken() }
              }
              override fun onError(w: WebSocket?, e: Exception) {}
              override fun onStart() { connectionLostTimeout = 20 }

              override fun onMessage(w: WebSocket, data: ByteBuffer) {
                  synchronized(this) {
                      val c = clients[w] ?: return; val r = roomOf(c) ?: return
                      if (r.talker === w) r.members.forEach { if (it !== w && it.isOpen) it.send(data.duplicate()) }
                  }
              }

              override fun onMessage(w: WebSocket, text: String) { synchronized(this) {
                  val m = try { JSONObject(text) } catch (e: Exception) { return }
                  val c = clients[w]
                  if (c != null) { val now = System.currentTimeMillis(); if (now - c.win > 1000) { c.win = now; c.cnt = 0 }; if (++c.cnt > 25) return }
                  when (m.optString("t")) {
                      "login" -> if (c == null) {
                          val base = calls.firstOrNull { it == m.optString("base") } ?: return err(w, "bad_call")
                          val num = m.optString("num").trim()
                          if (num.isNotEmpty() && !Regex("\\d{1,2}").matches(num)) return err(w, "bad_num")
                          val name = if (num.isEmpty()) base else "$base-$num"
                          if (names.containsKey(name.lowercase())) return err(w, "taken", name)
                          clients[w] = C(nextId++, name, m.optInt("avatar").coerceIn(0, 47)); names[name.lowercase()] = w
                          send(w, JSONObject().put("t", "welcome").put("name", name)); pushTaken()
                      }
                      "lang" -> if (c != null) { val lc = m.optString("code"); if (lc in langCodes) enter(w, "l:$lc", true) }
                      "leave" -> if (c != null) { leave(w); send(w, JSONObject().put("t", "left")) }
                      "create", "join" -> if (c != null) {
                          val code = m.optString("code").trim().take(32)
                          if (code.length < 3) return err(w, "short")
                          val key = "p:" + code.lowercase(); val ex = rooms.containsKey(key)
                          if (m.optString("t") == "create" && ex) return err(w, "exists")
                          if (m.optString("t") == "join" && !ex) return err(w, "nofound")
                          enter(w, key, true)
                      }
                      "ptt" -> if (c != null) { val r = roomOf(c) ?: return
                          if (m.optBoolean("on")) {
                              if (r.talker != null && r.talker !== w) return send(w, JSONObject().put("t", "busy"))
                              r.talker = w; pushMembers(r)
                              val o = JSONObject().put("t", "talk").put("id", c.id).put("on", true); r.members.forEach { send(it, o) }
                          } else release(w) }
                      "chat" -> if (c != null) { val r = roomOf(c) ?: return
                          val o = JSONObject().put("t", "chat").put("id", c.id).put("name", c.name).put("text", m.optString("text").take(500))
                          r.members.forEach { send(it, o) } }
                  }
                  Unit
              } }
          }
          WALKIE_EOF_8
          mkdir -p "$(dirname app/src/main/assets/index.html)"
          cat > app/src/main/assets/index.html <<'WALKIE_EOF_9'
          <!DOCTYPE html>
