          function lcd(){$('l1').textContent=on()?t('connected'):t('disc');
            $('l2').textContent=inLine?'# '+lineName:t('noline');
            const who=members.find(u=>rx.has(u.id));$('l3').textContent=who?who.name+' '+t('speaking'):(inLine?members.length+' '+t('online'):'');
            $('mems').innerHTML=members.slice(0,7).map(u=>`<span class="m${u.talking?' tk':''}">${avatar(u.avatar)}</span>`).join('');
            $('ptt').classList.toggle('rx',rx.size>0);$('ptt').disabled=!inLine;}
          function showErr(m){$('e1').textContent=$('e2').textContent=m||'';}
          function errText(m){let s=t('e_'+m.code);return s.replace('{n}',m.name||'').replace('{b}',(m.name||'').split('-')[0]);}

          function connect(){
            const a=$('srv').value.trim().replace(/^(wss?|https?):\/\//,'');if(!a)return;
            if(ws){ws.onclose=null;ws.close();}
            ws=new WebSocket('ws://'+a);ws.binaryType='arraybuffer';
            ws.onopen=()=>{searching=false;cstat();lcd();};
            ws.onmessage=ev=>{
              if(typeof ev.data!=='string')return play(ev.data);
              const m=JSON.parse(ev.data);
              if(m.t==='taken'){taken=m.taken;drawCalls();}
              else if(m.t==='error')showErr(errText(m));
              else if(m.t==='welcome'){$('me').textContent=m.name;$('s-setup').classList.remove('on');$('s-home').classList.add('on');open('sh-line');lcd();}
              else if(m.t==='entered'){myId=m.you;inLine=true;lineName=m.room.startsWith('l:')?LANGS[m.room.slice(2)]:m.room.replace(/^p:/,'');members=m.list;$('chat').innerHTML='';showErr('');shut();lcd();}
              else if(m.t==='left'){inLine=false;stopTalk();members=[];lcd();}
              else if(m.t==='members'){members=m.list;lcd();}
              else if(m.t==='chat'){const d=document.createElement('div');const b=document.createElement('b');b.textContent=m.name+':';d.append(b,document.createTextNode(m.text));$('chat').appendChild(d);$('chat').scrollTop=1e9;}
              else if(m.t==='talk'){if(m.on&&m.id!==myId)rx.add(m.id);else{rx.delete(m.id);if(!m.on&&m.id!==myId)beep();}lcd();}
              else if(m.t==='busy'){$('l3').textContent=t('busy');stopTalk(true);}
            };
            ws.onclose=()=>{lcd();cstat();if($('s-home').classList.contains('on')){$('l3').textContent=t('lost');setTimeout(()=>location.reload(),2500);}};
          }
          function findHost(){
            if(!window.Android){$('srv').value=$('srv').value||location.host;connect();return;}
            if(hosting)return;searching=true;cstat();Android.scan();let n=0;
            const iv=setInterval(()=>{const f=Android.found();
              if(f){clearInterval(iv);$('srv').value=f;connect();}
              else if(++n>14){clearInterval(iv);searching=false;cstat();}},700);}
          $('rescan').onclick=findHost;$('srv').onchange=connect;
          if(window.Android){$('host').style.display='';
            $('host').onclick=()=>{hosting=!hosting;const ip=Android.host(hosting);if(ip==='NOPERM'){hosting=false;$('cstat').textContent=t('mic');return;}
              if(hosting){$('srv').value='127.0.0.1:8765';$('cstat').textContent=t('connected')+(ip?' · '+ip+':8765':'');setTimeout(connect,900);}
              else findHost();$('host').textContent=t(hosting?'unhost':'host');};}

          $('start').onclick=async()=>{
            showErr('');if(base&&isTaken(base)&&!$('num').value.trim())return showErr(t('e_taken').replace('{n}',base).replace('{b}',base));if(!base)return showErr(t('pickfirst'));if(!on())return showErr(t('nocon'));
            try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});}catch(e){return showErr(t('mic'));}
            ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
            const src=ctx.createMediaStreamSource(stream);proc=ctx.createScriptProcessor(4096,1,1);
            proc.onaudioprocess=e=>{if(!talking||!on())return;const inp=e.inputBuffer.getChannelData(0),r=ctx.sampleRate/16000,n=Math.floor(inp.length/r),out=new Int16Array(n);
              for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,inp[Math.floor(i*r)]));out[i]=s<0?s*32768:s*32767;}ws.send(out.buffer);};
            const mute=ctx.createGain();mute.gain.value=0;src.connect(proc);proc.connect(mute);mute.connect(ctx.destination);
            try{localStorage.setItem('prof',JSON.stringify({l:letter,b:base,a:av}));}catch(e){}
            $('me-av').innerHTML=avatar(av);ws.send(JSON.stringify({t:'login',base,num:$('num').value,avatar:av}));};

          function play(buf){if(!ctx)return;const i16=new Int16Array(buf),f=new Float32Array(i16.length);for(let i=0;i<f.length;i++)f[i]=i16[i]/32768;
            const ab=ctx.createBuffer(1,f.length,16000);ab.copyToChannel(f,0);const s=ctx.createBufferSource();s.buffer=ab;s.connect(ctx.destination);
            nextT=Math.max(nextT,ctx.currentTime+0.12);s.start(nextT);nextT+=ab.duration;}
          function beep(){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=1000;g.gain.value=.08;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.08);}
          const p=$('ptt');
          function startTalk(){if(talking||p.disabled||rx.size)return;talking=true;p.classList.add('tx');p.textContent=t('tx');ws.send(JSON.stringify({t:'ptt',on:true}));}
          function stopTalk(silent){if(!talking)return;talking=false;p.classList.remove('tx');p.textContent=t('hold');if(!silent&&on())ws.send(JSON.stringify({t:'ptt',on:false}));beep();}
          p.addEventListener('contextmenu',e=>e.preventDefault());
          p.addEventListener('pointerdown',e=>{p.setPointerCapture(e.pointerId);startTalk();});
          ['pointerup','pointercancel'].forEach(k=>p.addEventListener(k,()=>stopTalk()));
          addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&e.target.tagName!=='INPUT'&&$('s-home').classList.contains('on')){e.preventDefault();startTalk();}});
          addEventListener('keyup',e=>{if(e.code==='Space')stopTalk();});addEventListener('blur',()=>stopTalk());

          $('create').onclick=()=>on()&&ws.send(JSON.stringify({t:'create',code:$('code').value}));
          $('join').onclick=()=>on()&&ws.send(JSON.stringify({t:'join',code:$('code').value}));
          $('bLeave').onclick=()=>on()&&ws.send(JSON.stringify({t:'leave'}));
          const sendChat=()=>{const x=$('ctext').value.trim();if(x&&inLine&&on()){ws.send(JSON.stringify({t:'chat',text:x}));$('ctext').value='';}};
          $('csend').onclick=sendChat;$('ctext').onkeydown=e=>{if(e.key==='Enter')sendChat();};

          try{const sv=JSON.parse(localStorage.getItem('prof')||'{}');
            if(CALLS[sv.l]){letter=sv.l;if(CALLS[sv.l].includes(sv.b)){base=sv.b;$('pick').textContent=base;}}if(sv.a>=0&&sv.a<32)av=sv.a;}catch(e){}
          $('chp').onclick=()=>location.reload();
          drawAvs();applyLang();findHost();
          </script></body></html>
