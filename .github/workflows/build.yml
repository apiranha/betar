name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project files
        run: |
          set -e
          mkdir -p "$(dirname settings.gradle.kts)"
          cat > settings.gradle.kts <<'WALKIE_EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Walkie"
          include(":app")
          WALKIE_EOF_0
          mkdir -p "$(dirname build.gradle.kts)"
          cat > build.gradle.kts <<'WALKIE_EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          WALKIE_EOF_1
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'WALKIE_EOF_2'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          WALKIE_EOF_2
          mkdir -p "$(dirname app/build.gradle.kts)"
          cat > app/build.gradle.kts <<'WALKIE_EOF_3'
