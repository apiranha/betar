              <path android:fillColor="#B58F00" android:pathData="M40,62h28v3h-28zM40,69h28v3h-28zM40,76h28v3h-28z"/>
              <path android:fillColor="#FF5C8A" android:pathData="M54,89m-4,0a4,4 0 1 0 8,0a4,4 0 1 0 -8,0"/>
