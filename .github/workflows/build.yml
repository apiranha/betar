          }
          dependencies { implementation("androidx.webkit:webkit:1.11.0"); implementation("androidx.core:core-ktx:1.13.1"); implementation("org.java-websocket:Java-WebSocket:1.5.6") }
          WALKIE_EOF_3
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'WALKIE_EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
