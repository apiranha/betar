              <path android:fillColor="#FFD32F" android:pathData="M62,14h6v18h-6z"/>
              <path android:strokeColor="#7BE0D0" android:strokeWidth="2.5" android:strokeLineCap="round" android:pathData="M73,18a8,8 0 0 1 0,12M78,13a14,14 0 0 1 0,22"/>
              <path android:fillColor="#FFD32F" android:pathData="M42,30h24a8,8 0 0 1 8,8v48a8,8 0 0 1 -8,8h-24a8,8 0 0 1 -8,-8v-48a8,8 0 0 1 8,-8z"/>
              <path android:fillColor="#0F172A" android:pathData="M40,36h28a3,3 0 0 1 3,3v14a3,3 0 0 1 -3,3h-28a3,3 0 0 1 -3,-3v-14a3,3 0 0 1 3,-3z"/>
