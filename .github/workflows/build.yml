            ws.onmessage=ev=>{
              if(typeof ev.data!=='string')return play(ev.data);
              const m=JSON.parse(ev.data);
              if(m.t==='taken'){taken=m.taken;drawCalls();}
              else if(m.t==='error'){if(profileReady&&!loggedIn){profileReady=false;try{localStorage.removeItem('prof');}catch(e){}show('s-setup');}showErr(errText(m));}
              else if(m.t==='welcome'){$('me').textContent=$('me2').textContent=$('me3').textContent=m.name;loggedIn=true;try{localStorage.setItem('prof',JSON.stringify({v:2,l:letter,b:base,n:profNum,a:av}));}catch(e){}ws.send(JSON.stringify({t:'spk',on:spkOn}));cstat();lcd();}
              else if(m.t==='entered'){myId=m.you;inLine=true;lineName=m.room.startsWith('l:')?LANGS[m.room.slice(2)]:m.room.replace(/^p:/,'');members=m.list;$('chat').innerHTML='';showErr('');shut();show('s-home');lcd();}
