          let letter='A',loggedIn=false,profileReady=false,profNum='',spkOn=true,micBlocked=false,isHostUI=false,cur='s-setup',prevScr='s-lines',base=null,av=0,taken=[],ws=null,myId=null,inLine=false,lineName='',members=[],talking=false,stream=null,ctx=null,proc=null,nextT=0,rx=new Set(),hosting=false,searching=false;

